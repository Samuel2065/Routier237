<svg width="720" height="260" viewBox="0 0 720 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1E4A"/>
      <stop offset="55%" stop-color="#123A88"/>
      <stop offset="100%" stop-color="#1E63D1"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9DD1FF"/>
      <stop offset="100%" stop-color="#3D9BFF"/>
    </linearGradient>

    <linearGradient id="busGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEEFF"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="720" height="260" rx="30" fill="url(#brandBg)"/>

  <g transform="translate(34 32)">
    <circle cx="96" cy="96" r="90" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="96" cy="96" r="74" stroke="url(#ringGrad)" stroke-width="8" filter="url(#softGlow)"/>

    <g transform="translate(48 56)">
      <rect x="0" y="0" width="96" height="58" rx="14" fill="url(#busGrad)"/>
      <rect x="10" y="10" width="27" height="16" rx="4" fill="#1C56BF"/>
      <rect x="42" y="10" width="44" height="16" rx="4" fill="#1C56BF"/>

      <circle cx="23" cy="63" r="12" fill="#FFFFFF"/>
      <circle cx="73" cy="63" r="12" fill="#FFFFFF"/>
      <circle cx="23" cy="63" r="5" fill="#1C56BF"/>
      <circle cx="73" cy="63" r="5" fill="#1C56BF"/>

      <path d="M10 88C24 75 72 75 86 88" stroke="#8DC8FF" stroke-width="6" stroke-linecap="round"/>
      <path d="M44 83H52" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(238 72)">
    <text x="0" y="58" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">Routier</text>
    <text x="236" y="58" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="#8FD0FF">+237</text>

    <rect x="2" y="76" width="360" height="2" fill="#9DC9FF" fill-opacity="0.5"/>

    <text x="2" y="106" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="500" fill="#DDEBFF" letter-spacing="0.3">Cameroon Road Travel Platform</text>
  </g>
</svg>
